# Pinned build profile for reproducible builds (used by arduino-cli and CI):
#   arduino-cli compile --profile nodemcuv2 sketches/ir-fan-controller
# The Arduino IDE uses its own installed core/libraries; install the same
# versions listed here through Boards Manager / Library Manager.
profiles:
  nodemcuv2:
    notes: NodeMCU v3 (ESP-12E, ESP8266MOD, CH340C)
    fqbn: esp8266:esp8266:nodemcuv2
    platforms:
      - platform: esp8266:esp8266 (3.1.2)
        platform_index_url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    libraries:
      - IRremoteESP8266 (2.9.0)
      - FirebaseClient (2.2.13)
      - ArduinoJson (7.4.3)

default_profile: nodemcuv2
