<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Home Control</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Firebase SDK version is pinned here only; code imports "firebase/*". -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Ambient background: aurora light + grid, purely decorative. -->
  <div class="backdrop" aria-hidden="true">
    <div class="aurora aurora--violet"></div>
    <div class="aurora aurora--cyan"></div>
    <div class="aurora aurora--magenta"></div>
    <div class="backdrop__grid"></div>
    <div class="backdrop__noise"></div>
  </div>

  <header class="app-header">
    <a class="brand" href="#/">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">Home</span>
    </a>
    <div id="header-actions" class="header-actions"></div>
  </header>

  <main id="app" class="app-main">
    <p class="muted center">Loading…</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
